# Orin->FC: select the neural controller. offact_mode picks the offact/two-rate path;
# slot_id (0..10) is the compiled slot; hash is the two-rate network identity (0 if n/a).

fields:
  time_us: uint32_t
  offact_mode: uint8_t
  slot_id: uint8_t
  hash: uint32_t
