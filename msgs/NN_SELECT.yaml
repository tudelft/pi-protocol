#
# Orin->FC: select the neural controller. mode: 0 legacy state-based net on the FC, 1 offact (Orin
# sends motor commands, slot/hash unused), 2 CTBR (Orin sends CTBR, board net in slot_id).
# slot_id (1..9) is the compiled slot; hash is the network identity (required for CTBR, 0 = no check).

fields:
  time_us: uint32_t
  mode: uint8_t
  slot_id: uint8_t
  hash: uint32_t
