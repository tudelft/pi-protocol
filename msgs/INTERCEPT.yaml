# supported datatypes
# (u)int8_t, (u)int16_t, (u)int32_t, (u)int64_t, float, double (double needs to be verified working)

fields:
  time_us: uint32_t
  target_locked: uint8_t # is target locked by visual system
  recover: uint8_t # should we initialize or be in recovery mode
  target_x: float # pos in NED of target
  target_y: float
  target_z: float