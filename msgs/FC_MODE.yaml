fields:
  time_us: uint32_t
  key: uint8_t
  # bit 0: 0 = not armed, 1 = armed
  # bit 1: 0 = not in pos mode, 1 = in pos mode
  # bit 2: 0 = not in recovery mode, 1 = in recovery mode
  # bit 3: 0 = no request to trigger recovery mode, 1 = trigger recovery mode (intended for orin to FC)
