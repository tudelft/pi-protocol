# OFFCTBR without the 32-dim FC context, for nets with no fc_context (FC feeds ctx = 0).
# 36 B instead of 164 B. prio0..3 as in OFFCTBR (zero for plain CTBR).

fields:
  time_us: uint32_t
  ctbr0: float
  ctbr1: float
  ctbr2: float
  ctbr3: float
  prio0: float
  prio1: float
  prio2: float
  prio3: float
