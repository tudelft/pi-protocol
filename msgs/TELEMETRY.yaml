# supported datatypes
# (u)int8_t, (u)int16_t, (u)int32_t, (u)int64_t, float, double (double needs to be verified working)

fields:
  time_us: uint32_t
  ned_x: float         # NED target position x [m]
  ned_y: float         # NED target position y [m]
  ned_z: float         # NED target position z [m]
  yaw: float           # yaw target angle [deg]
  armed: uint8_t
  flight_mode: uint32_t
  cell_voltage_cV: uint16_t  # getBatteryAverageCellVoltage(), units: 0.01V
  mah_drawn: uint32_t        # getMAhDrawn(), units: mAh
  esc_temp_0: int8_t         # ESC temperature motor 0 [deg C]
  esc_temp_1: int8_t         # ESC temperature motor 1 [deg C]
  esc_temp_2: int8_t         # ESC temperature motor 2 [deg C]
  esc_temp_3: int8_t         # ESC temperature motor 3 [deg C]
